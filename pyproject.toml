[project]
name = "openpoke-task-routing"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.119.1", "uvicorn==0.38.0", "pydantic==2.12.3",
  "httpx==0.28.1", "python-dateutil==2.9.0.post0", "beautifulsoup4==4.14.2",
  "chromadb==1.3.0", "numpy==2.3.4", "matplotlib==3.10.7",
]
[dependency-groups]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0", "ruff==0.14.2"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E9", "F"]

[tool.uv]
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
