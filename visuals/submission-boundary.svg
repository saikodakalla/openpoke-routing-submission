<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="760" viewBox="0 0 1160 760"><title>Independent routing application and local OpenPoke execution</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#617a9d"/></marker></defs><rect width="1160" height="760" fill="#f4f7fb"/><text x="40" y="46" text-anchor="start" font-family="Arial,sans-serif" font-size="26" font-weight="600" fill="#182b49">Your submission and the OpenPoke host</text><rect x="35" y="90" width="700" height="590" rx="12" fill="#eef3f8" stroke="#92a6c1"/><text x="385.0" y="391.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#182b49"></text><text x="60" y="125" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182b49">Independent submission/</text><rect x="230" y="155" width="305" height="64" rx="12" fill="white" stroke="#92a6c1"/><text x="382.5" y="193.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#182b49">Plain Next.js chat + System view</text><rect x="205" y="265" width="355" height="72" rx="12" fill="white" stroke="#92a6c1"/><text x="382.5" y="296.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#182b49">FastAPI routing application</text><text x="382.5" y="318.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#182b49">Lookup → retrieve → verify → clarify / dispatch</text><path d="M70,418 A135.0,18 0 0 1 340,418 V507 A135.0,18 0 0 1 70,507 Z" fill="#e1ecff" stroke="#2258c5"/><ellipse cx="205.0" cy="418" rx="135.0" ry="18" fill="#eaf1ff" stroke="#2258c5"/><text x="205.0" y="465" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#182b49">SQLite registry</text><text x="205.0" y="487" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#182b49">Authoritative records + action state</text><path d="M410,418 A135.0,18 0 0 1 680,418 V507 A135.0,18 0 0 1 410,507 Z" fill="#e1ecff" stroke="#2258c5"/><ellipse cx="545.0" cy="418" rx="135.0" ry="18" fill="#eaf1ff" stroke="#2258c5"/><text x="545.0" y="465" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#182b49">Persistent Chroma</text><text x="545.0" y="487" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#182b49">Created on first semantic fallback</text><polyline points="382,219 382,265" fill="none" stroke="#617a9d" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="280,337 205,400" fill="none" stroke="#617a9d" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="485,337 545,400" fill="none" stroke="#617a9d" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="785" y="90" width="335" height="590" rx="12" fill="#e9f3ed" stroke="#92a6c1"/><text x="952.5" y="391.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#182b49"></text><text x="810" y="125" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182b49">Local OpenPoke checkout</text><rect x="805" y="265" width="295" height="100" rx="12" fill="white" stroke="#92a6c1"/><text x="952.5" y="299.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#182b49">Execution bridge /execute</text><text x="952.5" y="321.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#182b49">Persisted request_id only</text><text x="952.5" y="343.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#182b49">Local credential + same SQLite file</text><rect x="805" y="445" width="295" height="110" rx="12" fill="white" stroke="#92a6c1"/><text x="952.5" y="484.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#182b49">Original execution runtime</text><text x="952.5" y="506.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#182b49">Saved task owner + scoped tools</text><text x="952.5" y="528.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#182b49">Draft / order → explicit approval</text><polyline points="560,298 805,298" fill="none" stroke="#617a9d" stroke-width="1.7" marker-end="url(#arrow)"/><text x="681" y="278" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#2258c5">HTTP · localhost</text><polyline points="953,365 953,445" fill="none" stroke="#617a9d" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="805,520 735,520 735,590 205,590 205,525" fill="none" stroke="#617a9d" stroke-width="1.7" marker-end="url(#arrow)"/><text x="485" y="620" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#2258c5">Action + activity rows</text><text x="45" y="716" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#182b49">The host imports upstream execution code. Routing policy and UI run without importing the OpenPoke server.</text></svg>