<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1040" viewBox="0 0 1280 1040"><title>OpenPoke task ownership routing</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#617a9d"/></marker></defs><rect width="1280" height="1040" fill="#f4f7fb"/><text x="45" y="45" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="600" fill="#182b49">OpenPoke / task ownership routing</text><text x="45" y="74" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#182b49">SQLite is authoritative. Chroma is a repairable semantic index.</text><rect x="480" y="104" width="340" height="65" rx="30" fill="#dceaff" stroke="#92a6c1"/><text x="650.0" y="142.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#182b49">User request + conversation context</text><rect x="360" y="203" width="560" height="235" rx="12" fill="#eaf0f9" stroke="#92a6c1"/><text x="640.0" y="326.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#182b49"></text><text x="385" y="232" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#182b49">1 · Direct ownership lookup</text><path d="M60,288 A120.0,18 0 0 1 300,288 V377 A120.0,18 0 0 1 60,377 Z" fill="#e1ecff" stroke="#2258c5"/><ellipse cx="180.0" cy="288" rx="120.0" ry="18" fill="#eaf1ff" stroke="#2258c5"/><text x="180.0" y="335" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#182b49">SQLite task registry</text><text x="180.0" y="357" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#182b49">Ownership · metadata · FTS</text><rect x="480" y="258" width="340" height="65" rx="12" fill="white" stroke="#92a6c1"/><text x="650.0" y="285.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#182b49">Resolve names / links / recent context</text><text x="650.0" y="307.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#182b49">Contacts · dates · state · keywords</text><path d="M650,337.5 L777.5,380 L650,422.5 L522.5,380 Z" fill="white" stroke="#2258c5"/><text x="650" y="375" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#182b49">Owner</text><text x="650" y="396" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#182b49">established?</text><polyline points="650,169 650,258" fill="none" stroke="#617a9d" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="300,305 480,290" fill="none" stroke="#617a9d" stroke-width="1.7" marker-end="url(#arrow)"/><text x="388" y="280" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#2258c5">Recorded evidence</text><polyline points="650,323 650,337" fill="none" stroke="#617a9d" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="522,380 338,380 338,808 180,808 180,837" fill="none" stroke="#617a9d" stroke-width="1.7" marker-end="url(#arrow)"/><text x="416" y="365" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#2258c5">Yes</text><rect x="360" y="474" width="560" height="310" rx="12" fill="#eaf0f9" stroke="#92a6c1"/><text x="640.0" y="635.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#182b49"></text><text x="385" y="504" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#182b49">2 · Vector fallback and verification</text><path d="M500,543 A150.0,18 0 0 1 800,543 V607 A150.0,18 0 0 1 500,607 Z" fill="#e1ecff" stroke="#2258c5"/><ellipse cx="650.0" cy="543" rx="150.0" ry="18" fill="#eaf1ff" stroke="#2258c5"/><text x="650.0" y="590" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#182b49">Persistent Chroma</text><text x="650.0" y="612" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#182b49">Task summary embeddings</text><polyline points="650,423 650,525" fill="none" stroke="#617a9d" stroke-width="1.7" marker-end="url(#arrow)"/><text x="778" y="459" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#2258c5">Uncertain · embed request</text><rect x="470" y="651" width="360" height="55" rx="12" fill="white" stroke="#92a6c1"/><text x="650.0" y="673.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#182b49">Reject stale versions; verify metadata</text><text x="650.0" y="695.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#182b49">Compare ownership evidence + history</text><polyline points="650,625 650,651" fill="none" stroke="#617a9d" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M650,711.0 L770.0,750 L650,789.0 L530.0,750 Z" fill="white" stroke="#2258c5"/><text x="650" y="745" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#182b49">Ownership</text><text x="650" y="766" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#182b49">supported?</text><polyline points="650,706 650,711" fill="none" stroke="#617a9d" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="530,750 355,750 355,868 310,868" fill="none" stroke="#617a9d" stroke-width="1.7" marker-end="url(#arrow)"/><text x="420" y="736" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#2258c5">Yes</text><rect x="60" y="837" width="250" height="100" rx="12" fill="#e0f2e9" stroke="#92a6c1"/><text x="185.0" y="871.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#182b49">Authorize task + owner</text><text x="185.0" y="893.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#182b49">Acquire task execution lease</text><text x="185.0" y="915.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#182b49">Resume saved execution agent</text><rect x="885" y="837" width="305" height="100" rx="12" fill="#fff1d7" stroke="#92a6c1"/><text x="1037.5" y="871.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#182b49">Persist pending request + evidence</text><text x="1037.5" y="893.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#182b49">Ask one real-world question</text><text x="1037.5" y="915.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#182b49">No execution until resolved</text><polyline points="770,750 1035,750 1035,837" fill="none" stroke="#617a9d" stroke-width="1.7" marker-end="url(#arrow)"/><text x="1017" y="735" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#2258c5">Still uncertain</text><polyline points="1190,887 1230,887 1230,190 820,190 820,258" fill="none" stroke="#617a9d" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="1080" y="150" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#2258c5">USER&#x27;S ANSWER</text><text x="1080" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#2258c5">Merge constraints; retry lookup</text><rect x="440" y="837" width="340" height="100" rx="12" fill="#e9edff" stroke="#92a6c1"/><text x="610.0" y="871.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#182b49">Explicit new work only</text><text x="610.0" y="893.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#182b49">Transaction: register task + owner</text><text x="610.0" y="915.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#182b49">Queue a durable index update</text><polyline points="650,789 650,837" fill="none" stroke="#617a9d" stroke-width="1.7" marker-end="url(#arrow)"/><text x="762" y="817" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#2258c5">New work confirmed</text><polyline points="440,887 310,887" fill="none" stroke="#617a9d" stroke-width="1.7" marker-end="url(#arrow)"/><text x="60" y="982" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#182b49">3 · Observable outcome</text><text x="60" y="1010" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#182b49">Completed / awaiting approval / blocked / failed → task events and routing trace in SQLite</text></svg>